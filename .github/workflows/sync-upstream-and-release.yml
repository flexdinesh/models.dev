name: Sync Upstream And Release

on:
  workflow_call:

env:
  CALLER_WORKFLOW: |
    name: Sync Upstream And Release

    on:
      schedule:
        - cron: "*/15 * * * *"
      workflow_dispatch:

    concurrency:
      group: sync-upstream-and-release
      cancel-in-progress: true

    jobs:
      sync-upstream-and-release:
        uses: flexdinesh/models.dev/.github/workflows/sync-upstream-and-release.yml@web-fast-overlay
        secrets: inherit

permissions:
  contents: write

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay branch
        uses: actions/checkout@v4
        with:
          ref: web-fast-overlay
          fetch-depth: 0
          path: overlay

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          path: repo
          token: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Sync upstream and build
        id: sync
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          repo_dir="$GITHUB_WORKSPACE/repo"
          overlay_dir="$GITHUB_WORKSPACE/overlay"
          upstream_url="https://github.com/anomalyco/models.dev.git"
          upstream_sha="$(git ls-remote "$upstream_url" refs/heads/dev | awk '{print $1}')"

          if [ -z "$upstream_sha" ]; then
            echo "Unable to resolve upstream dev SHA" >&2
            exit 1
          fi

          current_synced_sha="$({ git -C "$repo_dir" log -1 --format=%B | grep -E '^upstream-sha: ' | sed 's/^upstream-sha: //'; } || true)"
          if [ "$current_synced_sha" = "$upstream_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "SYNC_PUSH_TOKEN secret is required to push workflow file updates to dev" >&2
            exit 1
          fi

          expected_origin_sha="$(git -C "$repo_dir" rev-parse refs/remotes/origin/dev)"

          if git -C "$repo_dir" remote get-url upstream >/dev/null 2>&1; then
            git -C "$repo_dir" remote set-url upstream "$upstream_url"
          else
            git -C "$repo_dir" remote add upstream "$upstream_url"
          fi
          git -C "$repo_dir" fetch --no-tags upstream dev
          git -C "$repo_dir" checkout dev
          git -C "$repo_dir" reset --hard "$upstream_sha"

          rm -rf "$repo_dir/.github/workflows"
          mkdir -p "$repo_dir/.github/workflows"
          mkdir -p "$repo_dir/packages/web-fast"

          rsync -a --delete \
            --exclude "node_modules" \
            --exclude "dist" \
            "$overlay_dir/packages/web-fast/" \
            "$repo_dir/packages/web-fast/"

          printf '%s\n' "$CALLER_WORKFLOW" > "$repo_dir/.github/workflows/sync-upstream-and-release.yml"

          (
            cd "$repo_dir"
            bun install
          )

          (
            cd "$repo_dir/packages/web-fast"
            bun run build
          )

          if [ -z "$(git -C "$repo_dir" status --short)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C "$repo_dir" add .
          GIT_AUTHOR_NAME="github-actions[bot]" \
          GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
          GIT_COMMITTER_NAME="github-actions[bot]" \
          GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git -C "$repo_dir" commit -m "chore: sync upstream dev" -m "upstream-sha: $upstream_sha"
          git -C "$repo_dir" push --force-with-lease=refs/heads/dev:$expected_origin_sha origin HEAD:dev

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy placeholder
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          echo "TODO: add deploy script"
